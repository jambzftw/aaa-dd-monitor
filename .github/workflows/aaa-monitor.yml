name: aaa-monitor

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay runs a few minutes)
  workflow_dispatch:
    inputs:
      mode:
        description: "slots = show current Dec 18-19 evening slots (test), check-slots = run a monitor pass now, discover = list JSON endpoints"
        type: choice
        options: [slots, check-slots, discover]
        default: slots

permissions:
  contents: write

concurrency:
  group: aaa-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      AAA_DATES: ${{ vars.AAA_DATES }}                 # optional, default 2026-12-18,2026-12-19
      AAA_EVENING_FROM: ${{ vars.AAA_EVENING_FROM }}   # optional, default 17:00
      AAA_SITES: ${{ vars.AAA_SITES }}                 # optional, default 1001,1003,1020 (Glorietta, Greenbelt, Circuit)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Discover endpoints
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'discover'
        run: python aaa_monitor.py discover

      - name: Show current slots
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'slots'
        run: python aaa_monitor.py slots

      - name: Upload debug output
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'check-slots'
        uses: actions/upload-artifact@v4
        with:
          name: aaa-debug
          path: |
            aaa_discovery.json
            aaa_slots_raw.json
          if-no-files-found: warn

      - name: Check for new slots
        if: github.event_name == 'schedule' || inputs.mode == 'check-slots'
        run: python aaa_monitor.py check-slots

      - name: Save state
        if: github.event_name == 'schedule' || inputs.mode == 'check-slots'
        run: |
          git config user.name "aaa-bot"
          git config user.email "aaa-bot@users.noreply.github.com"
          git add aaa_state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
