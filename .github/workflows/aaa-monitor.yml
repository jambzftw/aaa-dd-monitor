name: aaa-monitor

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay runs a few minutes)
  workflow_dispatch:
    inputs:
      mode:
        description: "discover = list JSON endpoints, check = run a monitor pass now"
        type: choice
        options: [discover, check]
        default: discover

permissions:
  contents: write

concurrency:
  group: aaa-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Discover endpoints
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'discover'
        run: python aaa_monitor.py discover

      - name: Upload discovery results
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'discover'
        uses: actions/upload-artifact@v4
        with:
          name: aaa-discovery
          path: aaa_discovery.json
          if-no-files-found: warn

      - name: Check for schedule changes
        if: (github.event_name == 'schedule' || inputs.mode == 'check') && vars.ENDPOINT_FRAGMENT != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python aaa_monitor.py check "${{ vars.ENDPOINT_FRAGMENT }}"

      - name: Save state
        if: (github.event_name == 'schedule' || inputs.mode == 'check') && vars.ENDPOINT_FRAGMENT != ''
        run: |
          git config user.name "aaa-bot"
          git config user.email "aaa-bot@users.noreply.github.com"
          git add aaa_state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
